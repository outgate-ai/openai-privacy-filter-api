[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openai-privacy-filter-api"
version = "0.2.0"
description = "Ollama-compatible HTTP server exposing OpenAI Privacy Filter (OPF) as a drop-in /api/chat endpoint."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "outgate-ai" }]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.5",
    "opf @ git+https://github.com/openai/privacy-filter.git",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.4",
]

[project.scripts]
opf-api = "opf_api.__main__:main"

[project.urls]
Homepage = "https://github.com/outgate-ai/openai-privacy-filter-api"
Issues = "https://github.com/outgate-ai/openai-privacy-filter-api/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
